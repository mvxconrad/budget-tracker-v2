<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon: the square Quarterbyte mark. -->
    <link rel="icon" type="image/png" href="/quarterbyte_icon.png" />
    <link rel="apple-touch-icon" href="/quarterbyte_icon.png" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- SEO -->
    <title>Quarterbyte — AI Financial Advisor &amp; Smart Budgeting App</title>
    <meta
      name="description"
      content="Quarterbyte is a cutting-edge AI financial advisor. Build a smart budget in seconds, forecast your savings, benchmark your spending against your city, and get instant answers to your money what-ifs. Free to start."
    />
    <meta
      name="keywords"
      content="AI financial advisor, budgeting app, personal finance, savings forecast, money management, AI budget planner, financial planning, expense tracker"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://quarterbyte.net/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quarterbyte" />
    <meta property="og:title" content="Quarterbyte — Your AI Financial Advisor" />
    <meta
      property="og:description"
      content="A cutting-edge AI financial advisor that builds your budget, forecasts your savings, and answers your money what-ifs. Free to start."
    />
    <meta property="og:url" content="https://quarterbyte.net/" />
    <meta property="og:image" content="https://quarterbyte.net/quarterbyte_wordmark.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quarterbyte — Your AI Financial Advisor" />
    <meta
      name="twitter:description"
      content="A cutting-edge AI financial advisor that builds your budget, forecasts your savings, and answers your money what-ifs. Free to start."
    />
    <meta name="twitter:image" content="https://quarterbyte.net/quarterbyte_wordmark.png" />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quarterbyte",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "An AI financial advisor that builds your budget, forecasts your savings, and benchmarks your spending against your city.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        background: #f6f7f9;
        color: #111827;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection { background: rgba(59,130,246, 0.18); }
      input::placeholder { color: #aeb4bf; }

      /* Tabular figures for any number that should line up in columns. */
      .tnum { font-variant-numeric: tabular-nums; }

      /* Assistant "thinking" dots: three dots that pulse in sequence. */
      .think-dot {
        display: inline-block; width: 6px; height: 6px; margin: 0 1.5px;
        border-radius: 50%; background: #9aa1ad;
        animation: think-bounce 1.2s infinite ease-in-out both;
      }
      .think-dot:nth-child(1) { animation-delay: -0.32s; }
      .think-dot:nth-child(2) { animation-delay: -0.16s; }
      @keyframes think-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      /* Markdown rendering inside chat bubbles. */
      .md p { margin: 0 0 8px; }
      .md p:last-child { margin-bottom: 0; }
      .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
      .md li { margin: 2px 0; }
      .md strong { font-weight: 700; }
      .md em { font-style: italic; }
      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        background: rgba(17,24,39,0.06); padding: 1px 5px; border-radius: 4px;
      }
      .md h1, .md h2, .md h3 { font-size: 14px; font-weight: 700; margin: 8px 0 4px; }

      /* Remove native number-input spinner arrows. */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

      /* Inline editable text field. */
      .field {
        font: inherit;
        font-size: 13px;
        color: #111827;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 7px;
        outline: none;
        transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .field:hover { background: rgba(17, 24, 39, 0.04); }
      .field:focus {
        background: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246, 0.15);
      }

      /* Wrapper field (currency "$" prefix, unit suffix) — highlights as one unit. */
      .field-wrap {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: text;
        transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .field-wrap:hover { background: rgba(17, 24, 39, 0.04); }
      .field-wrap:focus-within {
        background: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246, 0.15);
      }
      .field-wrap .prefix { color: #9aa1ad; font-size: 13px; user-select: none; }
      .field-wrap input {
        font: inherit;
        font-size: 13px;
        color: #111827;
        background: transparent;
        border: none;
        outline: none;
        padding: 0;
        min-width: 0;
      }

      /* Buttons. */
      .btn {
        font: inherit;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease, filter 0.12s ease, transform 0.04s ease;
      }
      .btn:active:not(:disabled) { transform: translateY(0.5px); }
      .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
      .btn-ghost:hover:not(:disabled) { background: #f3f4f6; border-color: #d1d5db; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .icon-btn { cursor: pointer; transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease; }
      .icon-btn:hover {
        background: rgba(220, 38, 38, 0.08);
        color: #dc2626;
        border-color: rgba(220, 38, 38, 0.35);
      }

      .link-btn { font: inherit; cursor: pointer; transition: color 0.12s ease; }
      .link-btn:hover { color: #2563eb; }

      /* Sidebar nav items. */
      .nav-item { cursor: pointer; transition: background 0.12s ease, color 0.12s ease; }
      .nav-item:hover:not(.active):not(:disabled) { background: #f3f4f6; color: #111827; }
      .nav-item:disabled { cursor: default; }

      /* Table rows. */
      .row-hover { transition: background 0.1s ease; }
      .row-hover:hover { background: #f9fafb; }

      /* Elevated surfaces. */
      .card { box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      .card:hover { border-color: #d8dbe0; box-shadow: 0 2px 6px rgba(16, 24, 40, 0.07); }
      .panel { box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }

      /* Scrollbar. */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #d6d9df;
        border-radius: 8px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: #c2c7d0; background-clip: content-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
