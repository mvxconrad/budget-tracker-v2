name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/deploy/budget-tracker-v2
            sudo -u deploy git pull origin main
            sudo -u deploy /home/deploy/budget-tracker-v2/server/venv/bin/pip install -r /home/deploy/budget-tracker-v2/server/requirements.txt
            export DB_URL=$(sudo grep DATABASE_URL /etc/budget-tracker/.env | cut -d= -f2-)
            sudo -u deploy bash -c "cd /home/deploy/budget-tracker-v2/server && DATABASE_URL='$DB_URL' /home/deploy/budget-tracker-v2/server/venv/bin/alembic upgrade head"
            sudo systemctl restart budget-tracker