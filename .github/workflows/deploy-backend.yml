name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The EC2 security group only allows SSH from your IP. The GitHub runner
      # has a different (and changing) IP, so we temporarily open port 22 to the
      # runner's IP for the duration of the deploy, then close it again.
      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/deploy/budget-tracker-v2
            sudo -u deploy git pull origin main
            sudo -u deploy /home/deploy/budget-tracker-v2/server/venv/bin/pip install -r /home/deploy/budget-tracker-v2/server/requirements.txt
            export DB_URL=$(sudo grep DATABASE_URL /etc/budget-tracker/.env | cut -d= -f2-)
            sudo -u deploy bash -c "cd /home/deploy/budget-tracker-v2/server && DATABASE_URL='$DB_URL' /home/deploy/budget-tracker-v2/server/venv/bin/alembic upgrade head"
            sudo systemctl restart budget-tracker

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
